<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Guru</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #eef2f7;
    --kartu: #ffffff;
    --teks: #14213d;
    --teks-redup: #5b667a;
    --garis: #d6dde8;
    --aksen: #1d4ed8;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0e1522;
        --kartu: #172033;
        --teks: #e8edf6;
        --teks-redup: #98a4ba;
        --garis: #2a3650;
        --aksen: #6c9bff;
    }
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--teks);
    font-family: "Plus Jakarta Sans", sans-serif;
    line-height: 1.5;
}

.wadah {
    max-width: 1100px;
    margin: auto;
    padding: 24px 16px 48px;
}

header h1 {
    margin: 0 0 4px;
    font-size: 1.75rem;
    font-weight: 800;
}

header p {
    margin: 0;
    color: var(--teks-redup);
}

.kontrol {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px 0 8px;
}

.kontrol input, .kontrol select {
    font: inherit;
    color: var(--teks);
    background: var(--kartu);
    border: 1px solid var(--garis);
    border-radius: 10px;
    padding: 10px 12px;
}

.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 180px; }

.jumlah {
    color: var(--teks-redup);
    font-size: 0.9rem;
    margin: 0 0 16px;
}

.daftar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
}

.kartu {
    background: var(--kartu);
    border: 1px solid var(--garis);
    border-radius: 14px;
    overflow: hidden;
}

.pita {
    height: 65px;
    background: #2563eb;
}

.isi {
    padding: 0 16px 16px;
    text-align: center;
}

.foto {
    width: 85px;
    height: 85px;
    margin: -42px auto 10px;
    border-radius: 50%;
    border: 4px solid var(--kartu);
    background: #dbeafe;
    color: #1d4ed8;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 1.5rem;
    overflow: hidden;
}

.foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.nama {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
}

.nip {
    margin: 0 0 5px;
    color: var(--teks-redup);
    font-size: 0.85rem;
}

.jabatan {
    display: inline-block;
    background: #dbeafe;
    color: #1d4ed8;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 12px;
}

.rincian {
    margin: 0;
    text-align: left;
    font-size: 0.88rem;
}

.rincian div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-top: 1px solid var(--garis);
}

.rincian dt { color: var(--teks-redup); }

.rincian dd {
    margin: 0;
    font-weight: 600;
    text-align: right;
    overflow-wrap: anywhere;
}

.pesan {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 16px;
    color: var(--teks-redup);
}

.pesan.galat { color: #d93838; }

</style>
</head>

<body>

<div class="wadah">

    <header>
        <h1>Data Guru</h1>
        <p>Informasi dan profil tenaga pendidik sekolah.</p>
    </header>

    <div class="kontrol">
        <input
            id="cari"
            type="search"
            placeholder="Cari nama atau NIP"
            aria-label="Cari guru">

        <select id="filterJabatan">
            <option value="">Semua jabatan</option>
        </select>
    </div>

    <p id="jumlah" class="jumlah"></p>

    <main id="daftar" class="daftar"></main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>

// LANGKAH 1: PENGATURAN SUPABASE

const SUPABASE_URL = "https://garvfknxsgrmeyjmvdyw.supabase.co";

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImdhcnZma254c2dybWV5am12ZHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4Njk5NDksImV4cCI6MjEwNzQ0NTk0OX0.JNRutvw8z34NtCKA7NrTf3AgYMrJks_OMs7rKCSopg";

// LANGKAH 2: HUBUNGKAN SUPABASE

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elJabatan = document.getElementById("filterJabatan");

let semuaGuru = [];

// LANGKAH 3: AMBIL DATA GURU

async function muatData() {

    tampilkanPesan("Memuat data guru...");

    const { data, error } = await db
        .from("guru")
        .select("nip, nama, jabatan, jenis_kelamin, no_hp, email, alamat, foto_url")
        .order("nama");

    if (error) {
        console.error(error);
        tampilkanPesan(
            "Data guru tidak bisa dimuat. Periksa tabel, kolom, dan policy RLS Supabase.",
            true
        );
        return;
    }

    semuaGuru = data || [];

    isiPilihanJabatan();
    tampilkanGuru();
}

// LANGKAH 4: TAMPILKAN DATA GURU

function tampilkanGuru() {

    const kataKunci = elCari.value.trim().toLowerCase();
    const jabatanDipilih = elJabatan.value;

    const hasil = semuaGuru.filter((g) => {

        const cocokJabatan =
            !jabatanDipilih || g.jabatan === jabatanDipilih;

        const cocokCari =
            !kataKunci ||
            (g.nama || "").toLowerCase().includes(kataKunci) ||
            String(g.nip || "").toLowerCase().includes(kataKunci);

        return cocokJabatan && cocokCari;
    });

    elJumlah.textContent =
        hasil.length + " dari " + semuaGuru.length + " guru";

    elDaftar.replaceChildren();

    if (hasil.length === 0) {
        tampilkanPesan(
            semuaGuru.length === 0
            ? "Belum ada data guru."
            : "Guru tidak ditemukan."
        );
        return;
    }

    hasil.forEach((g) => {
        elDaftar.appendChild(buatKartu(g));
    });
}

// LANGKAH 5: MEMBUAT KARTU GURU

function buatKartu(g) {

    const kartu = el("article", "kartu");

    kartu.appendChild(el("div", "pita"));

    const isi = el("div", "isi");
    const foto = el("div", "foto");

    if (g.foto_url) {

        const gambar = document.createElement("img");

        gambar.src = g.foto_url;
        gambar.alt = "Foto " + g.nama;
        gambar.loading = "lazy";

        gambar.onerror = () => {
            foto.replaceChildren(
                document.createTextNode(inisial(g.nama))
            );
        };

        foto.appendChild(gambar);

    } else {

        foto.textContent = inisial(g.nama);

    }

    isi.appendChild(foto);

    isi.appendChild(
        el("h2", "nama", g.nama || "Tanpa nama")
    );

    isi.appendChild(
        el("p", "nip", "NIP: " + (g.nip || "-"))
    );

    isi.appendChild(
        el("span", "jabatan", g.jabatan || "Guru")
    );

    const rincian = el("dl", "rincian");

    tambahBaris(rincian, "Jenis kelamin", g.jenis_kelamin);
    tambahBaris(rincian, "No. HP", g.no_hp);
    tambahBaris(rincian, "Email", g.email);
    tambahBaris(rincian, "Alamat", g.alamat);

    isi.appendChild(rincian);

    kartu.appendChild(isi);

    return kartu;
}

// FUNGSI BANTU

function el(tag, kelas, teks) {

    const e = document.createElement(tag);

    if (kelas) e.className = kelas;
    if (teks) e.textContent = teks;

    return e;
}

function tambahBaris(dl, label, nilai) {

    if (!nilai) return;

    const baris = el("div");

    baris.appendChild(el("dt", "", label));
    baris.appendChild(el("dd", "", nilai));

    dl.appendChild(baris);
}

function inisial(nama) {

    return (nama || "G")
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map((k) => k[0].toUpperCase())
        .join("");
}

function tampilkanPesan(teks, galat) {

    elDaftar.replaceChildren(
        el("p", "pesan" + (galat ? " galat" : ""), teks)
    );
}

// LANGKAH 6: FILTER JABATAN

function isiPilihanJabatan() {

    const daftarJabatan = [
        ...new Set(
            semuaGuru.map((g) => g.jabatan).filter(Boolean)
        )
    ].sort();

    elJabatan.replaceChildren(
        el("option", "", "Semua jabatan")
    );

    elJabatan.options[0].value = "";

    daftarJabatan.forEach((j) => {

        const opsi = el("option", "", j);

        opsi.value = j;

        elJabatan.appendChild(opsi);

    });
}

// EVENT PENCARIAN

elCari.addEventListener("input", tampilkanGuru);

elJabatan.addEventListener("change", tampilkanGuru);

// JALANKAN PROGRAM

muatData();

</script>

</body>
</html>
